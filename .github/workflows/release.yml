name: release
# Push a tag like v0.4.1 to publish a release: the agent, the installers and a checksum file.
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Tag matches the version in the code
        run: |
          v=$(python3 lightkey_api.py --version)
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but code says $v"; exit 1; }
      - name: Tests
        run: python3 -m unittest discover -s tests
      - name: Shell syntax
        run: sh -n install.sh && sh -n uninstall.sh
      - name: Checksums
        run: sha256sum lightkey_api.py lightkey_cues.py install.sh uninstall.sh > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" lightkey_api.py lightkey_cues.py install.sh uninstall.sh SHA256SUMS \
            --title "${GITHUB_REF_NAME}" --generate-notes
